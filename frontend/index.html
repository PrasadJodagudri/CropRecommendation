<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- User Info and Logout Button -->
    <!-- This section is hidden by default and will be shown by JavaScript if a user is logged in -->
    <div id="user-info" class="absolute top-4 right-4 text-right" style="display: none;">
        <p class="text-gray-600 text-sm">Welcome, <span id="user-email" class="font-semibold"></span></p>
        <button id="logout-button" class="text-sm text-indigo-600 hover:underline focus:outline-none">Logout</button>
    </div>

    <!-- Main container for the whole application -->
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">

        <!-- Header Section -->
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Crop Recommendation System</h1>
        <p class="text-center text-gray-500 mb-8">Enter your farm's data to get a crop recommendation.</p>

        <!-- The Form -->
        <form id="recommendation-form" class="space-y-6">

            <!-- Grid layout for the input fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Nitrogen (N) Input -->
                <div>
                    <label for="N" class="block text-sm font-medium text-gray-700">Nitrogen (N)</label>
                    <input type="number" id="N" name="N" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 90">
                </div>

                <!-- Phosphorus (P) Input -->
                <div>
                    <label for="P" class="block text-sm font-medium text-gray-700">Phosphorus (P)</label>
                    <input type="number" id="P" name="P" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 42">
                </div>

                <!-- Potassium (K) Input -->
                <div>
                    <label for="K" class="block text-sm font-medium text-gray-700">Potassium (K)</label>
                    <input type="number" id="K" name="K" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 43">
                </div>

                <!-- pH Input -->
                <div>
                    <label for="ph" class="block text-sm font-medium text-gray-700">Soil pH</label>
                    <input type="number" step="0.01" id="ph" name="ph" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 6.50">
                </div>
            </div>

            <!-- City Input (Spans full width) -->
            <div>
                <label for="city" class="block text-sm font-medium text-gray-700">City / Town</label>
                <input type="text" id="city" name="city" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., Mumbai">
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-transform transform hover:scale-105">
                    Get Recommendation
                </button>
            </div>
        </form>

        <!-- Result Section -->
        <div id="result-container" class="mt-8 text-center" style="display: none;">
            <h2 class="text-2xl font-semibold text-gray-800 p-4 bg-gray-50 rounded-lg border">Recommended Crop: <span id="crop-result" class="text-indigo-600"></span></h2>
        </div>
    </div>

    <!-- IMPORTANT: This is a special "module" script for Firebase -->
    <script type="module">
        // Import the functions you need from the Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";

        // CRITICAL: PASTE YOUR FIREBASE CONFIG OBJECT HERE
        const firebaseConfig = {
    apiKey: "AIzaSyAUzsRO6hm2DtVzPqJ8t3PhV_bK2maiDbI",
    authDomain: "crop-recommendation-app-d81ea.firebaseapp.com",
    projectId: "crop-recommendation-app-d81ea",
    storageBucket: "crop-recommendation-app-d81ea.firebasestorage.app",
    messagingSenderId: "42714055647",
    appId: "1:42714055647:web:32cccc20fd0eda92de7a6a",
    measurementId: "G-9ZTV23Z1EM"
  };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Get references to all the HTML elements we need to interact with
        const form = document.getElementById('recommendation-form');
        const resultContainer = document.getElementById('result-container');
        const cropResultSpan = document.getElementById('crop-result');
        const submitButton = form.querySelector('button[type="submit"]');
        const userInfoDiv = document.getElementById('user-info');
        const userEmailSpan = document.getElementById('user-email');
        const logoutButton = document.getElementById('logout-button');

        // This is the core of our security. It runs whenever the user's login state might have changed.
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // --- USER IS LOGGED IN ---
                console.log("User is logged in:", user);
                userInfoDiv.style.display = 'block'; // Show the user info div
                userEmailSpan.textContent = user.email; // Display their email

                // The main form submission logic
                form.addEventListener('submit', async (event) => {
                    event.preventDefault();

                    const formData = new FormData(form);
                    const data = {
                        N: formData.get('N'),
                        P: formData.get('P'),
                        K: formData.get('K'),
                        ph: formData.get('ph'),
                        city: formData.get('city')
                    };

                    // Show loading state
                    cropResultSpan.textContent = 'Calculating...';
                    resultContainer.style.display = 'block';
                    submitButton.disabled = true;
                    submitButton.textContent = 'Analyzing...';

                    try {
                        // Get the user's ID token. This is the proof that they are logged in.
                        const idToken = await user.getIdToken();

                        // --- UPDATED FETCH CALL ---
                        const response = await fetch('http://127.0.0.1:5000/recommend', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                // Send the token to the backend for verification
                                'Authorization': 'Bearer ' + idToken
                            },
                            body: JSON.stringify(data)
                        });
                        
                        const result = await response.json();

                        if (!response.ok) {
                            // If the server responded with an error (like 404 or 500)
                            throw new Error(result.error || 'Something went wrong');
                        }
                        
                        // Display the successful result
                        cropResultSpan.textContent = result.crop;

                    } catch (error) {
                        console.error('Error:', error);
                        cropResultSpan.textContent = `Error: ${error.message}`;
                    } finally {
                        // Re-enable the button after the request is complete
                        submitButton.disabled = false;
                        submitButton.textContent = 'Get Recommendation';
                    }
                });

            } else {
                // --- USER IS SIGNED OUT ---
                console.log("No user is logged in. Redirecting to login page.");
                // If nobody is logged in, redirect them to the login page to protect this page.
                window.location.href = 'login.html';
            }
        });

        // Handle Logout Button Click
        logoutButton.addEventListener('click', () => {
            signOut(auth).then(() => {
                // The onAuthStateChanged function above will automatically detect the sign-out
                // and handle the redirection to the login page.
                console.log("User signed out successfully.");
            }).catch((error) => {
                console.error("Sign out error", error);
            });
        });
    </script>
</body>
</html>
