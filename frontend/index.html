<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- Main container for the whole application -->
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">

        <!-- Header Section -->
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Crop Recommendation System</h1>
        <p class="text-center text-gray-500 mb-8">Enter the soil and weather conditions to get a crop recommendation.</p>

        <!-- The Form -->
        <!-- We give it an id to easily select it with JavaScript -->
        <form id="recommendation-form" class="space-y-6">

            <!-- Grid layout for the input fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Nitrogen (N) Input -->
                <div>
                    <label for="N" class="block text-sm font-medium text-gray-700">Nitrogen (N)</label>
                    <input type="number" id="N" name="N" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 90">
                </div>

                <!-- Phosphorus (P) Input -->
                <div>
                    <label for="P" class="block text-sm font-medium text-gray-700">Phosphorus (P)</label>
                    <input type="number" id="P" name="P" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 42">
                </div>

                <!-- Potassium (K) Input -->
                <div>
                    <label for="K" class="block text-sm font-medium text-gray-700">Potassium (K)</label>
                    <input type="number" id="K" name="K" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 43">
                </div>

                <!-- ADD THIS NEW BLOCK -->
                <div>
                    <label for="city" class="block text-sm font-medium text-gray-700">City / Town</label>
                    <input type="text" id="city" name="city" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., Mumbai">
                </div>

                <!-- pH Input -->
                <div>
                    <label for="ph" class="block text-sm font-medium text-gray-700">Soil pH</label>
                    <input type="number" step="0.01" id="ph" name="ph" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 6.50">
                </div>

            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-transform transform hover:scale-105">
                    Get Recommendation
                </button>
            </div>
        </form>

        <!-- Result Section -->
        <!-- This is where the recommendation will be displayed. It's hidden for now. -->
        <div id="result-container" class="mt-8 text-center">
            <h2 class="text-2xl font-semibold text-gray-800 p-4 bg-gray-50 rounded-lg border">Recommended Crop: <span id="crop-result" class="text-indigo-600"></span></h2>
        </div>

    </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {

    const form = document.getElementById('recommendation-form');
    const resultContainer = document.getElementById('result-container');
    const cropResultSpan = document.getElementById('crop-result');
    const submitButton = form.querySelector('button[type="submit"]');

    // Initially hide the result container
    resultContainer.style.display = 'none';

    form.addEventListener('submit', (event) => {
        event.preventDefault();

        const formData = new FormData(form);
        const data = {
        N: formData.get('N'),
        P: formData.get('P'),
        K: formData.get('K'),
        ph: formData.get('ph'),
        city: formData.get('city') // Send the city name
        };

        // --- THIS IS THE NEW PART ---

        // Show a "loading" message and disable the button
        cropResultSpan.textContent = 'Calculating...';
        resultContainer.style.display = 'block'; // Show the result area
        submitButton.disabled = true;
        submitButton.textContent = 'Analyzing...';

        // Send the data to the backend server
        fetch('http://127.0.0.1:5000/recommend', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data) // Convert the JS object to a JSON string
        })
        .then(response => response.json()) // Parse the JSON response from the server
        .then(result => {
            // Display the result from the server
            cropResultSpan.textContent = result.crop;
        })
        .catch(error => {
            // If something goes wrong (e.g., server is down)
            console.error('Error:', error);
            cropResultSpan.textContent = 'Error! Could not connect to server.';
        })
        .finally(() => {
            // Re-enable the button after the request is complete
            submitButton.disabled = false;
            submitButton.textContent = 'Get Recommendation';
        });
      });
    });
  </script>
</body>
</html>
